[project]
name = "scaldys-project"
version = "0.15.0"
authors = [
  { name="Scaldys", email="scaldys@scaldys.net" },
]
description = "A modular build system for Python projects targeting Windows."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]
license-files = ["LICEN[CS]E*"]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
cython = [
    "cython>=3.2.9",
    "setuptools>=83.0.0",
]
windows = [
    "pyinstaller>=6.21.0",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[project.scripts]
scaldys-project = "scaldys_project.__main__:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scaldys_project.resources" = [".pre-commit-check-config.yaml"]

[dependency-groups]
dev = [
    "cython>=3.2.9",
    "pre-commit>=4.6.1",
    "pyinstaller>=6.21.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "setuptools>=83.0.0",
    "sphinx>=9.1.0",
    "sphinx-lint>=1.0.2",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["artifacts", "build", "dist", ".venv"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
exclude = [".venv"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
TypeCheckingMode = "basic"
